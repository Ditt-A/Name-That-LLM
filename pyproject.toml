[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "name-that-llm-research"
version = "0.1.0"
description = "Pretrained LLM attribution experiments with Gaussian heads, SVC and guarded group decoding"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.24",
  "scipy>=1.10",
  "pandas>=2.2",
  "scikit-learn>=1.4",
  "nbformat>=5.10",
  "pyarrow>=15",
]

[project.optional-dependencies]
dev = ["pytest>=8"]
kaggle = ["kaggle==2.2.4"]

[project.scripts]
ntl = "ntl.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
